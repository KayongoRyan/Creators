name: API tests

on:
  push:
    paths:
      - "apps/api/**"
      - "supabase/migrations/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "supabase/migrations/**"
      - ".github/workflows/api.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev,postgres]"
      - name: Run tests
        run: python -m pytest -q