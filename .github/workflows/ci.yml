name: CI

on:
  push:
    branches: [main, Ryan]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev,postgres]"
      - name: Pytest
        run: python -m pytest -q

  e2e-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install API
        working-directory: apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev,postgres]"
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: API smoke (Playwright)
        env:
          CI: "1"
          UVICORN_RELOAD: "0"
          AUTH_DEV: "1"
          JWT_SECRET: "ci-test-secret-must-be-32-bytes-min"
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
          SUPABASE_ANON_KEY: ""
        run: npm run test:e2e
